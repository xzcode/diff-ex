name: Verify and build desktop

on:
  push:
    branches: [master, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diff-ex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Core, frontend and browser checks
    runs-on: ubuntu-24.04
    env:
      OPENSSL_NO_VENDOR: '1'
      DIFF_EX_TEST_PDF_RENDER: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Native fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev openssh-server poppler-utils
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p diff-ex-core
      - name: Build and verify standalone CLI
        run: |
          cargo build --locked -p diff-ex-cli
          bash scripts/test-cli.sh
      - name: Isolated real database integration
        run: |
          for engine in mysql mariadb postgres mongodb; do
            bash scripts/test-native-databases.sh "$engine"
          done
      - name: Isolated real SFTP integration
        run: bash scripts/test-native-sftp.sh
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-verification
          path: artifacts/ui/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: browser-preview
          path: dist/

  desktop:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: Desktop · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: npm ci
      - name: Build desktop installers
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Package macOS app preserving permissions and links
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "target/universal-apple-darwin/release/bundle/macos/Diff EX.app" "target/universal-apple-darwin/release/bundle/Diff-EX-macos-universal.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: diff-ex-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/*.zip
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: diff-ex-*
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
