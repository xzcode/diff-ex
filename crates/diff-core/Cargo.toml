[package]
name = "diff-ex-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Offline comparison and synchronization engine for Diff EX"
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
encoding_rs = "0.8"
blake3 = "1"
ignore = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
similar = "3.2"
serde_yaml_ng = "0.10"
num-bigint = "0.4"
roxmltree = "0.21"
yaml-rust2 = "0.13"
regex = "1"
calamine = "0.38"
zip = { version = "9.8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
