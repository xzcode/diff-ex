[package]
name = "diff-ex-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Offline comparison and synchronization engine for Diff EX"
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
encoding_rs = "0.8"
blake3 = "1"
ignore = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
similar = "3.2"
serde_yaml_ng = "0.10"
num-bigint = "0.4"
roxmltree = "0.21"
yaml-rust2 = "0.13"
regex = "1"
calamine = "0.38"
zip = { version = "9.8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

sevenz-rust2 = { version = "0.27", default-features = false, features = ["bzip2", "ppmd", "deflate"] }
same-file = "1"

git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
ssh2 = { version = "0.9", features = ["vendored-openssl", "openssl-on-win32"] }
base64 = "0.22"
lopdf = { version = "0.47", default-features = false }

rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
mysql = { version = "28", default-features = false, features = ["minimal-rust", "native-tls"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = { version = "0.2", features = ["vendored"] }
mongodb = { version = "3.10", default-features = false, features = ["compat-3-0-0", "rustls-tls", "sync"] }

tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
sevenz-rust2 = { version = "0.27", default-features = false, features = ["compress"] }
